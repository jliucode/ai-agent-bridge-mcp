[project]
name = "ai-agent-bridge-mcp"
version = "1.0.0"
description = "AI Agent Bridge — MCP protocol bridge for agent-to-agent communication, task delegation, and monitoring"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "twell" }
]
keywords = ["mcp", "ai-agent", "fastapi", "sse", "agent-bridge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
full = [
    "pandas",
    "openpyxl",
    "requests",
    "openai",
    "pymupdf",
    "pdfplumber",
    "pypdf",
    "pyxlsb",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
